# Test-only configuration: never falls back to WORKFLOW_TEST_DB_URL or the development DB.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=apolo_workflow_test;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true
spring.liquibase.change-log=classpath:db/changelog/test-host/test-host-master.xml
spring.liquibase.drop-first=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
workflow.console.enabled=false

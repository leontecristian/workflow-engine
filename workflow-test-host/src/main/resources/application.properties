spring.application.name=workflow-test-host

# Local SQL Server Express: authenticate as the Windows user running the JVM.
# Trust the server certificate only for this local development connection.
spring.datasource.url=${WORKFLOW_TEST_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=apolo_workflow_dev;integratedSecurity=true;authenticationScheme=NativeAuthentication;encrypt=true;trustServerCertificate=true}

# The host is the sole migration runner. Core only supplies workflow changelog resources.
spring.liquibase.change-log=classpath:db/changelog/test-host/test-host-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

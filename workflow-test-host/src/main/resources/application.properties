spring.application.name=workflow-test-host

# Supply a disposable local SQL Server database; credentials belong to the host environment.
spring.datasource.url=${WORKFLOW_TEST_DB_URL}
spring.datasource.username=${WORKFLOW_TEST_DB_USERNAME}
spring.datasource.password=${WORKFLOW_TEST_DB_PASSWORD}

# The host is the sole migration runner. Core only supplies workflow changelog resources.
spring.liquibase.change-log=classpath:db/changelog/test-host/test-host-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

<header class="page-heading">
  <div>
    <div class="eyebrow">{{ meta().eyebrow }}</div>
    <h1>{{ meta().title }}</h1>
    <p>{{ meta().description }}</p>
  </div>
  <div class="page-context">
    <console-icon [name]="meta().icon" /><span
      >{{ admin() ? 'Administrator workspace' : 'Reviewer workspace' }}</span
    >
  </div>
</header>

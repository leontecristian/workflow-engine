<console-page-header [meta]="meta" /><console-feedback
  [busy]="busy()"
  [error]="error()"
  [notice]="notice()"
/>
<mat-card appearance="outlined"
  ><mat-card-header
    ><div class="card-heading">
      <div>
        <h2>{{meta.listTitle}}</h2>
        <p>{{meta.listDescription}}</p>
      </div>
      <span class="count-badge">{{rows().length}} on this page</span>
    </div></mat-card-header
  ><mat-card-content
    ><console-collection
      [rows]="rows()"
      kind="instance-tasks"
      label="Tasks"
      icon="tasks"
      [busy]="busy()"
      [size]="pageSize"
      [next]="next"
      (sizeChange)="pageSize=$event;load()"
      (reload)="load()"
      (advance)="nextPage()"
      (inspect)="open($event)" /></mat-card-content
></mat-card>

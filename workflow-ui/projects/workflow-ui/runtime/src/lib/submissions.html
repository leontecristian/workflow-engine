<console-page-header [meta]="meta" /><console-feedback
  [busy]="busy()"
  [error]="error()"
  [notice]="notice()"
/>
<mat-card appearance="outlined"
  ><mat-card-header
    ><div class="card-heading">
      <div>
        <h2>{{meta.listTitle}}</h2>
        <p>{{meta.listDescription}}</p>
      </div>
      <span class="count-badge">{{rows().length}} on this page</span>
    </div></mat-card-header
  ><mat-card-content
    ><console-collection
      [rows]="rows()"
      kind="submissions"
      label="Submissions"
      icon="file"
      [busy]="busy()"
      [size]="pageSize"
      [next]="next"
      (sizeChange)="pageSize=$event;load()"
      (reload)="load()"
      (advance)="nextPage()"
      (inspect)="open($event)" />
    @for(row of rows(); track row.taskId){
      @if(row.resultJson !== undefined){
        <mat-expansion-panel class="evidence-panel">
          <mat-expansion-panel-header><mat-panel-title>Task #{{row.taskId}} result</mat-panel-title></mat-expansion-panel-header>
          <pre>{{row.resultJson}}</pre>
          <button mat-button (click)="downloadResult(row)">Download result JSON</button>
        </mat-expansion-panel>
      }
    }
  </mat-card-content
></mat-card>

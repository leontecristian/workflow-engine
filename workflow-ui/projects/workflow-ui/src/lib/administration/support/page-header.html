<header class="page-heading" [class.with-title-actions]="titleActions()">
  <div class="heading-copy">
    <div class="eyebrow">{{ meta().eyebrow }}</div>
    <h1>{{ meta().title }}</h1>
    <p class="description">{{ meta().description }}</p>
  </div>
  <div class="page-context">
    <mat-icon aria-hidden="true">{{meta().icon}}</mat-icon><span
      >{{ context() || (admin() ? 'Administrator workspace' : 'Reviewer workspace') }}</span
    >
  </div>
  <div class="page-actions"><ng-content select="[pageTitleAction]" /></div>
</header>

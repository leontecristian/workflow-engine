@if (error()) {
<div class="feedback feedback-error" role="alert">
  <console-icon name="info" />
  <div>
    <strong>Action could not be completed</strong>
    <p>{{ error() }}</p>
  </div>
</div>
} @if (notice()) {
<div class="feedback feedback-success" role="status">
  <console-icon name="check" />
  <div>{{ notice() }}</div>
</div>
} @if (busy()) {<mat-progress-bar
  mode="indeterminate"
  aria-label="Loading workflow data"
/>}
